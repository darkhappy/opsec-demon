name: Deus Ex Machina
on: [push, pull_request]
jobs:
  verify:
    runs-on: docker
    container:
      image: rust:1.93.1-bookworm
    steps:
      - run: apt-get update && apt-get install -y python3 git nodejs ca-certificates
      - uses: https://github.com/actions/checkout@v4
      - run: sh scripts/ci.sh
