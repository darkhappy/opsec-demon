apiVersion: v1
kind: Service
metadata:
  name: opsec-demon
  namespace: nightfall
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector: {app: opsec-demon}
  ports: [{name: metrics, port: 9090, targetPort: metrics}]
