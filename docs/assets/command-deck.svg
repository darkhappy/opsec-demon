<text x="44" y="99" font-family="monospace" font-size="15" fill="#72ffad">OPSEC DEMON // NIGHTWRAITH // VENOM</text><text x="44" y="128" font-family="monospace" font-size="15" fill="#8797ab">CONCEPT DECK / ILLUSTRATION / NOT A CAPTURE</text><text x="44" y="157" font-family="monospace" font-size="15" fill="#fff"></text><text x="44" y="186" font-family="monospace" font-size="15" fill="#ff7c93">[SIM] awakening the porcelain archdemon .......... READY</text><text x="44" y="215" font-family="monospace" font-size="15" fill="#72ffad">[SIM] routing club-penguin dairy mesh ............ READY</text><text x="44" y="244" font-family="monospace" font-size="15" fill="#72ffad">[SIM] allocating 512 virtual GB ................. READY</text><text x="44" y="273" font-family="monospace" font-size="15" fill="#72ffad">[SIM] Little Bido decoy shuffle ................. READY</text><text x="44" y="302" font-family="monospace" font-size="15" fill="#72ffad">[LOCAL] worker echo round trip .................. VERIFIED</text><text x="44" y="331" font-family="monospace" font-size="15" fill="#fff"></text><text x="44" y="360" font-family="monospace" font-size="15" fill="#eafff2">EXECUTE &gt; callsign NIGHTWRAITH</text><text x="44" y="389" font-family="monospace" font-size="15" fill="#eafff2">EXECUTE &gt; theme venom</text><text x="44" y="418" font-family="monospace" font-size="15" fill="#eafff2">EXECUTE &gt; mainframe local</text><text x="44" y="447" font-family="monospace" font-size="15" fill="#eafff2">EXECUTE &gt; mainframe ping</text><text x="44" y="476" font-family="monospace" font-size="15" fill="#eafff2">EXECUTE &gt; pedal stomp</text><text x="44" y="505" font-family="monospace" font-size="15" fill="#fff"></text><text x="44" y="534" font-family="monospace" font-size="15" fill="#ff7c93">REAL COMMANDS: /bin/sh     FICTIONAL DRAMA: UNREASONABLE</text><text x="810" y="95" font-family="monospace" font-size="13" fill="#a5b7c9">FREQUENCY RESPONSE / SYNTHETIC</text><path d="M810 120H1220" stroke="#213140"/><path d="M810 150H1220" stroke="#213140"/><path d="M810 180H1220" stroke="#213140"/><path d="M810 210H1220" stroke="#213140"/><path d="M810 240H1220" stroke="#213140"/><path d="M810 165L860 165L910 163L960 158L990 140L1010 137L1040 180L1090 201L1140 213L1220 228" fill="none" stroke="#72ffad" stroke-width="3"/><text x="810" y="270" font-family="monospace" font-size="13" fill="#a5b7c9">PHASE / SYNTHETIC</text><path d="M810 295H1220" stroke="#213140"/><path d="M810 325H1220" stroke="#213140"/><path d="M810 355H1220" stroke="#213140"/><path d="M810 385H1220" stroke="#213140"/><path d="M810 415H1220" stroke="#213140"/><path d="M810 320L860 324L910 334L960 351L1010 387L1060 407L1110 418L1220 440" fill="none" stroke="#72ffad" stroke-width="3"/><rect x="810" y="482" width="410" height="69" fill="#ff4265" fill-opacity=".06" stroke="#ff4265"/>
