<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title"><title id="title">Nightfall feature telemetry — source counts, not comparative benchmarks</title><rect width="1280" height="440" rx="16" fill="#080c13"/><g font-family="monospace"><text x="40" y="55" fill="#72ffad" font-size="24">NIGHTFALL // VERIFIED FEATURE INVENTORY</text><text x="40" y="85" fill="#8797ab" font-size="14">Source-derived counts / local release artifact / no invented speedup claims</text><rect x="40" y="110" width="390" height="130" rx="8" fill="#101c27" stroke="#263d49"/><text x="62" y="170" fill="#72ffad" font-size="42">0</text><text x="62" y="209" fill="#a5b7c9" font-size="15">EXTERNAL CRATES</text><rect x="450" y="110" width="390" height="130" rx="8" fill="#101c27" stroke="#263d49"/><text x="472" y="170" fill="#72ffad" font-size="42">8</text><text x="472" y="209" fill="#a5b7c9" font-size="15">DASHBOARD TABS</text><rect x="860" y="110" width="390" height="130" rx="8" fill="#101c27" stroke="#263d49"/><text x="882" y="170" fill="#72ffad" font-size="42">5</text><text x="882" y="209" fill="#a5b7c9" font-size="15">NAMED MASCOTS</text><rect x="40" y="260" width="390" height="130" rx="8" fill="#101c27" stroke="#263d49"/><text x="62" y="320" fill="#72ffad" font-size="42">20</text><text x="62" y="359" fill="#a5b7c9" font-size="15">CI ADAPTER FILES</text><rect x="450" y="260" width="390" height="130" rx="8" fill="#101c27" stroke="#263d49"/><text x="472" y="320" fill="#72ffad" font-size="42">256</text><text x="472" y="359" fill="#a5b7c9" font-size="15">ANSI COLOR INDICES</text><rect x="860" y="260" width="390" height="130" rx="8" fill="#101c27" stroke="#263d49"/><text x="882" y="320" fill="#72ffad" font-size="42">51.89s</text><text x="882" y="359" fill="#a5b7c9" font-size="15">ORIGINAL SCORE</text></g></svg>