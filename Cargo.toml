[package]
name = "opsec-demon"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A neon Rust command shell with an honest local mainframe simulator"
license = "MIT"

[dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts"] }
png = "=0.18.1"
pollster = "=0.4.0"
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "wgsl"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

