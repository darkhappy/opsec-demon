apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsec-demon.fullname" . }}
  labels:
    {{- include "opsec-demon.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: {{ .Values.service.port | quote }}
    prometheus.io/path: /metrics
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "opsec-demon.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
