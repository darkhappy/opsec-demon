name: Native Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows ${{ matrix.check }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [check, test, docs, desktop-and-package]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.7
      - run: mise run windows:setup
      - name: Formatting and Clippy
        if: matrix.check == 'check'
        run: mise run check
      - name: Unit tests
        if: matrix.check == 'test'
        run: mise run test
      - name: Rust documentation
        if: matrix.check == 'docs'
        run: cargo +1.93.1-x86_64-pc-windows-gnu doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Native commands, fresh 4K desktop frame and executable packaging
        if: matrix.check == 'desktop-and-package'
        run: |
          mise run smoke
          mise run windows:package
