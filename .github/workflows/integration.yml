name: Runtime integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        suite: [terminal, sockets-and-metrics]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: PTY dashboard, boot, shell commands and terminal restoration
        if: matrix.suite == 'terminal'
        run: mise run smoke
      - name: Socket protocol and real HTTP exporter
        if: matrix.suite == 'sockets-and-metrics'
        run: |
          cargo test --locked -- --ignored
          mise run build
          python3 tests/metrics_smoke.py
