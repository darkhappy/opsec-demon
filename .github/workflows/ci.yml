name: Rust and terminal checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.7
      - run: mise run check
      - run: mise run test
      - run: mise exec -- cargo test -- --ignored
      - run: mise run build
      - run: python3 tests/tui_smoke.py --boot
