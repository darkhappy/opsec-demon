name: Deus Ex Machina / Rust and terminal checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightfall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.7
      - run: sh scripts/ci.sh
        env:
          OPSEC_CI_SOCKETS: '1'
