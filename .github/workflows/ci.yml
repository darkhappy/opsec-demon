name: Rust quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Rust ${{ matrix.check }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        check: [check, test, docs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.7
      - run: rustup component add rustfmt clippy
      - name: Formatting and Clippy
        if: matrix.check == 'check'
        run: mise run check
      - name: Unit tests
        if: matrix.check == 'test'
        run: mise run test
      - name: Rust documentation
        if: matrix.check == 'docs'
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
